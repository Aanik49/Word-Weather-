<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Archival Bauhaus Cream Tile Background -->
  <rect width="512" height="512" rx="96" fill="#F4F1DE" />
  <rect x="18" y="18" width="476" height="476" rx="80" stroke="#18181B" stroke-width="20" />

  <!-- Architectural Crosshair Grid Accents -->
  <line x1="18" y1="364" x2="494" y2="364" stroke="#18181B" stroke-width="10" stroke-opacity="0.16" />
  <line x1="340" y1="18" x2="340" y2="494" stroke="#18181B" stroke-width="10" stroke-opacity="0.16" />

  <!-- Core Ink Circle -->
  <circle cx="268" cy="244" r="152" fill="#18181B" />

  <!-- Cadmium Yellow Geometric Sun Rays -->
  <g stroke="#F4B942" stroke-width="14" stroke-linecap="square">
    <line x1="340" y1="76" x2="340" y2="108" />
    <line x1="428" y1="164" x2="460" y2="164" />
    <line x1="402" y1="102" x2="424" y2="80" />
    <line x1="278" y1="102" x2="256" y2="80" />
  </g>
  <!-- Diagonal Bauhaus Sunbeam -->
  <line x1="366" y1="194" x2="444" y2="272" stroke="#F4B942" stroke-width="18" stroke-linecap="square" />

  <!-- Vermilion Sun Disk -->
  <circle cx="340" cy="164" r="46" fill="#E03C31" stroke="#18181B" stroke-width="8" />

  <!-- Wind Dashed Streaks across Ink Circle -->
  <g stroke="#F4F1DE" stroke-width="8" stroke-dasharray="16 12" stroke-linecap="square">
    <line x1="234" y1="352" x2="352" y2="234" />
    <line x1="264" y1="368" x2="376" y2="256" />
  </g>

  <!-- Faceted Bauhaus Cobalt Cloud -->
  <polygon
    points="66,272 104,218 144,218 164,174 220,174 244,218 290,218 310,252 286,282 82,282"
    fill="#2B5B84"
    stroke="#18181B"
    stroke-width="10"
    stroke-linejoin="round"
  />
  <polyline
    points="104,218 148,282 164,174 210,282 220,174 258,282 244,218"
    fill="none"
    stroke="#18181B"
    stroke-width="7"
    stroke-linejoin="round"
  />

  <!-- Geometric Falling Rain Lines -->
  <g stroke="#2B5B84" stroke-width="10" stroke-linecap="square">
    <line x1="104" y1="306" x2="104" y2="394" />
    <line x1="138" y1="306" x2="138" y2="424" />
    <line x1="172" y1="306" x2="172" y2="378" />
    <line x1="206" y1="306" x2="206" y2="412" />
  </g>

  <!-- Iconic Bauhaus Letter Tile 'W' -->
  <rect x="268" y="316" width="128" height="128" fill="#18181B" />
  <rect x="256" y="304" width="128" height="128" fill="#F4B942" stroke="#18181B" stroke-width="10" />
  <path
    d="M284 336 L300 400 L320 356 L340 400 L356 336"
    stroke="#18181B"
    stroke-width="14"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
</svg>
